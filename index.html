<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>勉強メモ</title>
  <link rel="stylesheet" href="/momo-jp/styles.css">
</head>
<body class="page-hub">
  <main class="hub">
    <header class="site-header">
      <h1>勉強メモ</h1>
      <p class="sublabel">momo-jp</p>
    </header>

    <section class="filters" aria-label="絞り込み">
      <div class="filter-section">
        <div id="period-chips" class="chip-row" role="group" aria-label="期間"></div>
      </div>
      <div class="filter-section filter-section--category">
        <button
          type="button"
          id="cat-toggle"
          class="category-toggle"
          aria-expanded="false"
          aria-controls="category-panel-open"
        >
          <span class="category-toggle__label">カテゴリで絞る</span>
          <span class="category-toggle__affordance" aria-hidden="true">›</span>
        </button>
        <div id="category-selected" class="category-selected chip-row chip-row--wrap" hidden></div>
        <div id="category-panel-open" class="category-panel-open" hidden>
          <div id="category-chips" class="chip-row chip-row--wrap" role="group" aria-label="カテゴリ"></div>
        </div>
        <button type="button" id="cat-clear" class="chip-clear" hidden>解除</button>
      </div>
      <p id="count" class="count">0件</p>
    </section>

    <p id="empty" class="empty" hidden>この条件のカードはないよ</p>
    <ul id="card-list" class="card-list"></ul>
  </main>
  <script src="/momo-jp/hub.js" type="module"></script>
</body>
</html>
