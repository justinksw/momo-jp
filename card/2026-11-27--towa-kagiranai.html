<p>「すぐ電話が来るとは限らないよ。」</p>
<p><strong>〜とは限らない</strong>＝並不保證一定會〜、未必。即使條件在，結果也不一定。N2〜N1 常考。</p>
<p>変化：限る／限らない／限って／限った／限れば／限ったら</p>
<p>例：安ければいいとは限らない。＝便宜未必就好。</p>
