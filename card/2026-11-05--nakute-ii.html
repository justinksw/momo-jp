  <article class="detail__body prose">
<p>「送らなくていい。」</p>
<p><strong>〜なくていい</strong>＝不用〜也可以（ない形去い＋ていい）。許可／放寬語氣：對方不必做某事。</p>
<p>作り方：送る → 送らない → 送らなくていい<br>書く → 書かなくていい<br>返信する → 返信しなくていい</p>
<p>例：今すぐ答えなくていいよ。＝不用馬上回答也行。</p>

  </article>
