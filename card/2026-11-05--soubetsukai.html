<p>「送別会、行けるかどうか決まったら一言でいいよ。」</p>
<p><strong>送別会（そうべつかい）</strong>＝歡送會／farewell lunch・dinner。同事離職或調職時常辦；店名貼群、有人 @ 你時，未必要立刻回——去不去定了再說一句就夠。</p>
<p>関連：歓送迎会（かんそうげいかい）＝歡送＋歡迎合併；ランチ会＝午餐聚會（較輕鬆）。</p>
<p>例：来週送別会がある。＝下週有歡送會。</p>
