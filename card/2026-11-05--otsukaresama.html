  <article class="detail__body prose">
<p>「お疲れさま。」／「どういたしまして。」</p>
<p><strong>お疲れさま</strong>＝辛苦了。工作告一段落、下班、或對方忙完時說。比「お疲れ様です」隨便一點；熟人／同輩常用。</p>
<p>回「ありがとう」用 <strong>どういたしまして</strong>（不客氣）。別人對你說「お疲れさま」時，回「お疲れさま」也可以。</p>
<p>注意：早上見面別先說お疲れさま——通常是告一段落之後才說。</p>

  </article>
