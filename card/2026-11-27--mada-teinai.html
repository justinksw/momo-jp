    <h1>まだ〜ていない</h1>
    <div class="detail__meta">
      <time datetime="2026-11-27">11/27</time>
      <span class="chip chip--cat" data-cat="grammar">文法</span>
    </div>
  </header>
  <article class="detail__body prose">
<p>「iPhoneの実機では、まだ確認できていないよ。」</p>
<p><strong>まだ〜ていない</strong>＝到現在還沒做完／還沒能〜。ている的否定：不是「不做」，是「尚未完成」。できていない＝還沒能做成。</p>
<p>変化：確認する → 確認している／確認していない<br>確認できる／確認できない／確認できて／確認できた／確認できなければ／確認できていない</p>
<p>例：実機ではまだ試していない。＝還沒用實機試過。</p>

  </article>
