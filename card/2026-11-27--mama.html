<p>「今ある数字のまま、図で見えるようにするね。」</p>
<p><strong>〜まま</strong>＝維持原樣、不改動。接辭書形、た形或名詞：保持那個狀態去做別的事。這裡：數字不重抓，就用現有的來做圖。</p>
<p>変化：ある／ない／あって／あった／あれば／あったら<br>あるまま／あったまま</p>
<p>例：ロックした本文のまま使う。＝就用鎖定後的正文，不去改。</p>
