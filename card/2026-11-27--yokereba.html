  <article class="detail__body prose">
<p>「よければ、その方向で進めるね。」</p>
<p><strong>よければ</strong>＝如果可以的話（いい／よい的ば形，不是いければ）。口語提議：對方點頭，就照這方向走。</p>
<p>変化：いい／よい → よくない／よくて／よければ／よかったら／よかった</p>
<p>例：よければ、明日もう一回見よう。＝可以的話，明天再看一次。</p>

  </article>
