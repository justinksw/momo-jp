  <article class="detail__body prose">
<p>「少なくともルートが404にならないようにする。」</p>
<p><strong>少なくとも〜ないようにする</strong>＝至少要讓〜不要發生。「少なくとも」＝起碼；「〜ないようにする」＝設法避免（ようにする接辭書形，否定就接ない形）。</p>
<p>変化：なる／ならない／なって／なった／なれば／なったら<br>なるようにする＝促成那樣／ならないようにする＝避免那樣</p>
<p>例：少なくとも期限に遅れないようにする。＝至少不要過期。</p>

  </article>
