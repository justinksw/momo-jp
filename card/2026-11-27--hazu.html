      <span class="chip chip--cat" data-cat="grammar">文法</span>
    </div>
  </header>
  <article class="detail__body prose">
<p>「バッジが外れたら、この切れも消えるはず。」</p>
<p><strong>〜はず</strong>＝照理應該會〜（依已知條件推論，不是單純希望）。辭書形／た形＋はず。外れたら是條件，はず是「那之後按理會消失」。</p>
<p>変化：消える／消えない／消えて／消えた／消えれば／消えたら<br>消えるはず／消えるはずがない</p>
<p>例：今出せば、今日中に着くはず。＝現在寄的話，照理今天會到。</p>

  </article>
