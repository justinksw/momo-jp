    </div>

  <article class="detail__body prose">
<p>「こう直すのがよさそう。」</p>
<p><strong>〜のがよさそう</strong>＝這樣〜看起來比較好。「の」把動詞名詞化，「よさそう」是いい的推量形（不是いいそう）。主觀判斷：還沒做，但看樣子這條路對。</p>
<p>変化：いい → よさそう／よくない → よくなさそう<br>直す → 直すのがよさそう／直さない方がよさそう<br>直して／直した／直せば／直したら</p>
<p>例：先に下書きを書くのがよさそう。＝先寫草稿看起來比較好。</p>

  </article>
