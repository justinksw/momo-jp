    <h1>〜たくなったら</h1>
    <div class="detail__meta">
      <time datetime="2026-11-27">11/27</time>
      <span class="chip chip--cat" data-cat="grammar">文法</span>
    </div>
  </header>
  <article class="detail__body prose">
<p>「また続きたくなったら、いつでも声かけてね。」</p>
<p><strong>〜たくなったら</strong>＝等到又想〜的時候。たい接上なる，表示那股念頭出現；再加たら。不是「想做就立刻」，而是「等想繼續了再」。</p>
<p>変化：続く → 続きたい／続きたくない／続きたくて／続きたければ／続きたくなったら</p>
<p>例：休みたくなったら、先に言って。＝想休息的時候，先說一聲。</p>

  </article>
