  <article class="detail__body prose">
<p>「いったんここまでにしよう。」</p>
<p><strong>いったん〜にしよう</strong>＝先告一段落、暫時到此為止。「いったん」＝先、暫且；「〜にしよう」＝先決定這樣做（する的意向形）。不是結束，是先停在這裡。</p>
<p>変化：する／しない／して／した／すれば／したら／しよう</p>
<p>例：今日はいったんここまでにしよう。＝今天就先到這裡吧。</p>

  </article>
