  <article class="detail__body prose">
<p>「もし気になって残しておきたいなら、通った時間と場所だけメモしておけば十分。」</p>
<p><strong>〜ておく</strong>＝先做好準備、先記下以備之後。て＋おく。おけば＝如果先這樣做的話；おきたい＝想先準備好。</p>
<p>変化：メモする → メモしておく／メモしておかない／メモしておいて／メモしておいた／メモしておけば／メモしておいたら</p>
<p>例：時間と場所だけ残しておきたい。＝想先把時間和地點留下來。</p>

  </article>
