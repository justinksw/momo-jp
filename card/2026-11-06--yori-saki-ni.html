  <article class="detail__body prose">
<p>「Skillsより先に、誰か・何をしてるかを一言。」</p>
<p><strong>〜より先に</strong>＝在〜之前先做別的（優先順序，不只是時間上的「前に」）。這裡：不要先堆 Skills，先用一句話說你是誰、在做什麼。</p>
<p>変化：する／してる（している的口語）／しない／して／した／すれば／したら</p>
<p>例：説明するより先に、一度見てみて。＝解釋之前，先看一次。</p>

  </article>
