  <article class="detail__body prose">
<p>「テンプレ英語とAIっぽい言い回しはやめて。」</p>
<p><strong>っぽい</strong>＝有〜的味道、很〜的感覺。接名詞（或少數詞幹）：AIっぽい＝很像AI寫的；子どもっぽい、忘れっぽい。這裡勸你丢掉套話。</p>
<p>変化：やめる／やめない／やめて／やめた／やめれば／やめたら</p>
<p>例：その言い回し、ちょっと教科書っぽいね。＝那措辭有點教科書味。</p>

  </article>
