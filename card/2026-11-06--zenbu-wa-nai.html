    </div>

  <article class="detail__body prose">
<p>「48個全部は並べない。」</p>
<p><strong>全部は〜ない</strong>＝不是全部都〜（部分否定）。「は」標出範圍：不是「一個都不擺」（全部並べない），而是「不把48個全擺出來」。N2〜N1 常考：全部／必ずしも／あまり＋は＋ない。</p>
<p>変化：並べる／並べない／並べて／並べた／並べれば／並べたら</p>
<p>例：全部は読まなくていい。＝不必全部讀完。</p>

  </article>
