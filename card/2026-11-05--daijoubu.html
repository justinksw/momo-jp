  <article class="detail__body prose">
<p>「返信しなくて大丈夫。」</p>
<p><strong>大丈夫（だいじょうぶ）</strong>＝沒問題、可以、不用擔心。口語很常用；回覆「要不要回？」時說「大丈夫」＝不用回也行。</p>
<p>変化：大丈夫だ／大丈夫じゃない／大丈夫なら／大丈夫だった</p>
<p>例：今日行けなくても大丈夫。＝今天去不了也沒關係。</p>

  </article>
