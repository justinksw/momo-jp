  <article class="detail__body prose">
<p>「あとから続きやすいようにまとめた一枚の文書はないよ。」</p>
<p><strong>〜やすい</strong>＝容易〜（動詞ます形＋やすい）。這裡：以後要接著做時很順手。反義是〜にくい（不容易〜）。</p>
<p>変化：続く → 続きやすい／続きにくい<br>まとめる → まとめやすい／まとめにくかった／まとめやすければ</p>
<p>例：このメモの方が続きやすい。＝這份筆記比較容易接著寫。</p>

  </article>
