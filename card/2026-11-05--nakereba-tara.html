  <article class="detail__body prose">
<p>「精度が下がらなければ、攻撃は当たるはずだ。」<br>「撃破したらVPがもらえる。」</p>
<p><strong>〜なければ</strong>＝如果不〜（ない形＋ければ）<br><strong>〜たら</strong>＝〜之後／如果〜的話（た形＋ら）</p>
<p>当たる → 当たらなければ／当たったら<br>攻撃する → 攻撃しなければ／攻撃したら</p>
<p>例：隣接していなければ争奪できない。＝如果不鄰接，就不能爭奪。</p>

  </article>
