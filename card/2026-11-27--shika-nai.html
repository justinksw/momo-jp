    <h1>しか〜ない</h1>
    <div class="detail__meta">
      <time datetime="2026-11-27">11/27</time>
      <span class="chip chip--cat" data-cat="grammar">文法</span>
    </div>
  </header>
  <article class="detail__body prose">
<p>「途中までしか進めなかった。」</p>
<p><strong>しか〜ない</strong>＝只能〜／只不過〜到（後面一定要否定）。途中までしか＝只推進到一半，沒走完。肯定句不能只用しか。</p>
<p>変化：進める／進めない／進めて／進めた／進めば／進めたら／進めなかった</p>
<p>例：今日は途中までしか読めなかった。＝今天只讀到一半。</p>

  </article>
