  <article class="detail__body prose">
<p>「LIVEにするのは、またあなたのOKをいただいてからにするよ。」</p>
<p><strong>〜てから</strong>＝先做完〜之後才〜。いただく是もらう的謙讓語。〜てからにする＝決定要等那件事完成後才做，不是現在立刻LIVE。</p>
<p>変化：いただく／いただかない／いただいて／いただいた／いただけば／いただいたら</p>
<p>例：確認してから送る。＝確認完再寄。</p>

  </article>
