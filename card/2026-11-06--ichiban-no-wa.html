    <div class="detail__meta">

    </div>
  </header>
  <article class="detail__body prose">
<p>「いちばん効くのは、玄関を直して今の作品を載せること。」</p>
<p><strong>いちばん〜のは〜こと</strong>＝最有效的是〜（強調構文）。先用「のは」把重點提前，再用「こと」把動作當名詞收尾。N2〜N1 很常見：不是「Aが効く」，而是「効く的那件事＝A」。</p>
<p>変化：効く／効かない／効いて／効いた／効けば／効いたら</p>
<p>例：いちばん大切なのは、自分の言葉で書くこと。＝最重要的是用自己的話說。</p>

  </article>
