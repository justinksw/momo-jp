  <article class="detail__body prose">
<p>「公開するかどうかはあとで決めよう。」</p>
<p><strong>〜かどうか</strong>＝是否〜（把「要不要」收成一個子句）。するかどうか＝要不要做。後面常接決める／わかる／まだ分からない。</p>
<p>変化：する／しない／して／した／すれば／したら／するかどうか／したかどうか</p>
<p>例：届くかどうか、まだわからない。＝能不能送到，還不知道。</p>

  </article>
