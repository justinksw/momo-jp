  <article class="detail__body prose">
<p>「Celineに頼むね。」</p>
<p><strong>頼む（たのむ）</strong>＝拜託。口語常加「ね」，語氣比較軟。</p>
<p>変化：頼んで／頼んだ／頼まない／頼まなければ／頼んだら</p>
<p>例：Beatriceに確認を頼むね。＝拜託 Beatrice 核對一下。</p>
